<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background-color: black;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  margin-top: 30px;
}

/* Layout: vehicle light + camera in center, pedestrian light on right */
.main-container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: nowrap;          /* prevent wrapping so columns stay side by side */
}

/* Traffic light housing */
.traffic-housing {
  width: 70px;
  background: #222;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 0 15px rgba(255,255,255,0.1);
  margin-right: 10px;
}

/* Each light circle */
.traffic-light {
  width: 50px;
  height: 50px;
  margin: 8px auto;
  border-radius: 50%;
  background: #111;
  box-shadow: 0 0 6px rgba(0,0,0,0.8) inset;
  position: relative;
}

/* Base (off) colors */
.red-light   { background: #330000; }
.yellow-light{ background: #333300; }
.green-light { background: #003300; }

/* Active glow */
.active-red {
  background: red;
  box-shadow: 0 0 20px red;
}
.active-yellow {
  background: yellow;
  box-shadow: 0 0 20px yellow;
}
.active-green {
  background: #00ff00;
  box-shadow: 0 0 20px #00ff00;
}

h1 {
  font-family: "Lobster", cursive;
  color:white;
}

button {
  padding: 10px 18px;
  background: #4a90e2;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
  margin: 4px;
}

button:hover {
  background: #5ca3ff;
  box-shadow: 0 0 10px #5ca3ff;
}

/* Click Start text */
#click-start {
  color: #4a90e2;
  font-size: 16px;
  font-weight: bold;
  margin-top: 8px;
  opacity: 1;
  transition: opacity 0.3s ease;
}

#click-start.hidden {
  opacity: 0;
  pointer-events: none;
}

#webcam-container canvas {
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
  width: 90vw;
  max-width: 400px;
  height: auto;
}

/* Predictions now below camera */
.predictions-below {
  margin-top: 20px;
  min-width: 280px;
  text-align: left;
}

#label-container .prediction-box {
  margin-top: 5px;
  padding: 10px;
  background: #1a1a1a;
  color: #d9d9d9;
  border-radius: 8px;
  width: 100%;
  max-width: 260px;
  text-align: center;
  font-size: 16px;
  box-shadow: 0 0 10px rgba(255,255,255,0.05);
  margin-left: auto;
  margin-right: auto;
}

.camera-section {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Container for vehicle column */
.traffic-column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Label under traffic housings */
.traffic-label {
  margin-top: 4px;
  font-size: 14px;
}

/* Pedestrian column on right */
.ped-column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Glowing pedestrian icon */
.ped-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  font-size: 26px;
  color: #007700;
  opacity: 0;
  text-shadow: 0 0 8px #00ff00;
  transition: opacity 0.2s ease;
}

.pedestrian-active .ped-icon {
  opacity: 1;
  color: #00ff00;
  text-shadow: 0 0 15px #00ff00;
}

/* Make layout fit on small screens but keep left–center–right order */
@media (max-width: 600px) {
  .main-container {
    gap: 10px;
  }

  .traffic-housing {
    width: 55px;
    padding: 8px;
    margin-right: 4px;
  }

  .traffic-light {
    width: 40px;
    height: 40px;
    margin: 6px auto;
  }

  #webcam-container canvas {
    max-width: 260px;
  }

  .predictions-below {
    min-width: 240px;
  }

  /* Let all three columns shrink so they stay on one row */
  .traffic-column,
  .camera-section,
  .ped-column {
    flex: 0 1 auto;
  }
}
</style>
</head>

<body>

<h1><b>SmartCross Ai</b></h1>

<div>
  <button type="button" onclick="startModel()">Start</button>
  <button type="button" onclick="toggleCamera()">Switch Camera</button>
  <div id="click-start">Click Start</div>
</div>

<div class="main-container">
  <!-- Vehicle traffic light on the left -->
  <div class="traffic-column">
    <div class="traffic-housing">
      <div id="tl-red" class="traffic-light red-light"></div>
      <div id="tl-yellow" class="traffic-light yellow-light"></div>
      <div id="tl-green" class="traffic-light green-light"></div>
    </div>
    <div class="traffic-label">Vehicles</div>
  </div>

  <!-- Camera center, probability table below -->
  <div class="camera-section">
    <div id="webcam-container"></div>

    <div id="top-prediction" style="margin-top:20px; font-size:18px; color:#4a90e2; font-weight:bold;">
        Top prediction: -
    </div>

    <div id="signal-light" style="margin-top:20px; font-size:22px; font-weight:bold;"></div>
    <div id="signal-text" style="margin-top:10px; font-size:18px;"></div>

    <!-- Probability table moved here -->
    <div class="predictions-below">
      <div id="label-container"></div>
    </div>
  </div>

  <!-- Pedestrian traffic light on the right -->
  <div class="ped-column">
    <div class="traffic-housing">
      <div id="ped-red" class="traffic-light red-light"></div>
      <div id="ped-green" class="traffic-light green-light">
        <div class="ped-icon"></div>
      </div>
    </div>
    <div class="traffic-label">Pedestrians</div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/jI7H07_mv/";

let model, webcam, labelContainer, maxPredictions;
let isRunning = false;

// smoothing state
let currentSignal = "none";        // "ped", "car", "traf", "none"
let lastWinner = "none";
let sameWinnerCount = 0;
const STABLE_FRAMES = 5;          // frames needed for same winner
const THRESHOLD = 50;
const HYSTERESIS = 10;

// 3s delay before switching signal
const SWITCH_DELAY_MS = 3000;
let pendingSignal = null;
let pendingTimeoutId = null;

let facingMode = "environment";

async function startModel() {
    document.getElementById("click-start").classList.add("hidden");
    
    if (pendingTimeoutId !== null) {
        clearTimeout(pendingTimeoutId);
        pendingTimeoutId = null;
        pendingSignal = null;
    }
    currentSignal = "none";
    lastWinner = "none";
    sameWinnerCount = 0;

    if (webcam) {
        await webcam.stop();
        webcam = null;
        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("label-container").innerHTML = "";
    }

    if (!model) {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
    }

    const size = Math.min(window.innerWidth * 0.9, 400);
    const flip = (facingMode === "user");

    webcam = new tmImage.Webcam(size, size, flip);
    await webcam.setup({ facingMode: facingMode });
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
        const div = document.createElement("div");
        div.className = "prediction-box";
        labelContainer.appendChild(div);
    }

    isRunning = true;
    window.requestAnimationFrame(loop);
}

async function toggleCamera() {
    facingMode = (facingMode === "environment") ? "user" : "environment";
    if (isRunning) {
        await startModel();
    }
}

// Vehicle traffic light
function setTrafficLight(color) {
    const redEl = document.getElementById("tl-red");
    const yellowEl = document.getElementById("tl-yellow");
    const greenEl = document.getElementById("tl-green");

    redEl.classList.remove("active-red");
    yellowEl.classList.remove("active-yellow");
    greenEl.classList.remove("active-green");

    if (color === "red") {
        redEl.classList.add("active-red");
    } else if (color === "yellow") {
        yellowEl.classList.add("active-yellow");
    } else if (color === "green") {
        greenEl.classList.add("active-green");
    }
}

// Pedestrian traffic light (red/green only, with glowing icon)
function setPedestrianLight(color) {
    const pedRed = document.getElementById("ped-red");
    const pedGreen = document.getElementById("ped-green");

    if (!pedRed || !pedGreen) return;

    pedRed.classList.remove("active-red");
    pedGreen.classList.remove("active-green", "pedestrian-active");

    if (color === "red") {
        pedRed.classList.add("active-red");
    } else if (color === "green") {
        pedGreen.classList.add("active-green", "pedestrian-active");
    }
}

async function loop() {
    if (!isRunning || !webcam) return;
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    if (!model || !webcam) return;

    const prediction = await model.predict(webcam.canvas);

    for (let i = 0; i < prediction.length; i++) {
        labelContainer.childNodes[i].innerHTML =
            prediction[i].className + ": " + prediction[i].probability.toFixed(2);
    }

    let top = prediction[0];
    for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > top.probability)
            top = prediction[i];
    }
    document.getElementById("top-prediction").innerHTML =
        "Top prediction: " + top.className;

    let pedProb = 0;
    let carProb = 0;
    let trafProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        const name = prediction[i].className.toLowerCase();
        const prob = prediction[i].probability;

        if (name === "ped" || name === "pedestrian") {
            pedProb = prob;
        } else if (name === "car") {
            carProb = prob;
        } else if (name === "traf" || name === "traffic") {
            trafProb = prob;
        }
    }

    const pedConf = pedProb * 100;
    const carConf = carProb * 100;
    const trafConf = trafProb * 100;

    const lightBox = document.getElementById("signal-light");
    const textBox = document.getElementById("signal-text");

    const pedHigh = pedConf > THRESHOLD;
    const carHigh = carConf > THRESHOLD;
    const trafHigh = trafConf > THRESHOLD;

    let frameWinner = "none";

    if (pedHigh && carHigh) {
        if (pedConf >= carConf) {
            frameWinner = "ped";
        } else {
            frameWinner = "car";
        }
    } else {
        const candidates = [];
        if (pedHigh)  candidates.push({key: "ped",  conf: pedConf});
        if (carHigh)  candidates.push({key: "car",  conf: carConf});
        if (trafHigh) candidates.push({key: "traf", conf: trafConf});

        if (candidates.length === 0) {
            frameWinner = "none";
        } else {
            candidates.sort((a, b) => b.conf - a.conf);
            const best = candidates[0];
            const second = candidates[1];

            if (!second || best.conf >= second.conf + HYSTERESIS) {
                frameWinner = best.key;
            } else {
                frameWinner = lastWinner;
            }
        }
    }

    if (frameWinner === lastWinner) {
        sameWinnerCount++;
    } else {
        sameWinnerCount = 1;
        lastWinner = frameWinner;
    }

    if (sameWinnerCount >= STABLE_FRAMES) {
        scheduleSignalChange(frameWinner, lightBox, textBox);
    }
}

function scheduleSignalChange(frameWinner, lightBox, textBox) {
    if (frameWinner === currentSignal) return;
    if (pendingSignal === frameWinner) return;

    if (pendingTimeoutId !== null) {
        clearTimeout(pendingTimeoutId);
        pendingTimeoutId = null;
        pendingSignal = null;
    }

    pendingSignal = frameWinner;
    pendingTimeoutId = setTimeout(() => {
        applySignalChange(frameWinner, lightBox, textBox);
        pendingSignal = null;
        pendingTimeoutId = null;
    }, SWITCH_DELAY_MS);
}

function applySignalChange(frameWinner, lightBox, textBox) {
    if (frameWinner === currentSignal) return;

    currentSignal = frameWinner;

    if (frameWinner === "ped") {
        setTrafficLight("red");
        setPedestrianLight("green");
        lightBox.innerHTML = "🟢 PEDESTRIAN PRIORITY";
        textBox.innerHTML = "Pedestrians detected in majority. Cross now, cars must wait.";
    } else if (frameWinner === "car") {
        setTrafficLight("green");
        setPedestrianLight("red");
        lightBox.innerHTML = "🔴 PEDESTRIANS WAIT";
        textBox.innerHTML = "More cars detected. Please wait before crossing.";
    }else if (frameWinner === "traf") {
    setTrafficLight("green");   // green for vehicles
    setPedestrianLight("red");  // red for pedestrians
    lightBox.innerHTML = "🟢 VEHICLE PRIORITY";
    textBox.innerHTML = "Traffic detected. Vehicles go, pedestrians wait.";
} else if (frameWinner === "none") {
        setTrafficLight(null);
        setPedestrianLight(null);
        lightBox.innerHTML = "⚪";
        textBox.innerHTML = "Scanning...";
    }
}
</script>

</body>
</html>
